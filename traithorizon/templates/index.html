<!doctype html>
<html>

<head>
  <!-- SlickGrid -->
  <link rel="stylesheet" href="{{url_for('static', filename='libs/slickgrid/css/slick.grid.css')}}" type="text/css" />
  <link rel="stylesheet" href="{{url_for('static', filename='libs/slickgrid/css/slick.pager.css')}}" type="text/css" />
  <link rel="stylesheet" href="{{url_for('static', filename='libs/slickgrid/css/slick-icons.css')}}" type="text/css" />
  <link rel="stylesheet" href="{{url_for('static', filename='libs/slickgrid/css/example-demo.css')}}" type="text/css" />
  <link rel="stylesheet" href="{{url_for('static', filename='libs/dropzone/css/dropzone.min.css')}}" type="text/css" />
  <link rel="stylesheet" href="{{url_for('static', filename='libs/slickgrid/css/slick-alpine-theme.css')}}"
    type="text/css" />
  <!-- <link rel="stylesheet" href="{{url_for('static', filename='libs/slickgrid/css/columnpicker.css')}}" type="text/css"/> -->

  <script src="{{url_for('static', filename='libs/jquery/js/jquery-1.7.min.js')}}"></script>
  <script src="{{url_for('static', filename='libs/jquery/js/jquery.event.drag-2.0.min.js')}}"></script>

  <script src="{{url_for('static', filename='libs/slickgrid/js/slick.core.js')}}"></script>
  <script src="{{url_for('static', filename='libs/slickgrid/js/slick.interactions.js')}}"></script>
  <script src="{{url_for('static', filename='libs/slickgrid/js/slick.grid.js')}}"></script>
  <script src="{{url_for('static', filename='libs/slickgrid/js/slick.dataview.js')}}"></script>
  <script src="{{url_for('static', filename='libs/dropzone/js/dropzone.min.js')}}"></script>

  <script src="{{url_for('static', filename='libs/slickgrid/js/controls/slick.pager.js')}}"></script>
  <script src="{{url_for('static', filename='libs/slickgrid/js/controls/slick.columnpicker.js')}}"></script>

  <link rel="stylesheet" type="text/css" href="{{url_for('static', filename='libs/parcoords/css/parcoords.css')}}">
  <link rel="stylesheet" type="text/css" href="{{url_for('static', filename='css/style.css')}}">
  <style>
    body,
    html {
      margin: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
      font-size: 12px;
      background-color: aliceblue;
    }

    body {
      overflow: scroll
    }

    .plot {
      position: absolute;
    }

    #scatter-card {
      height: 500px;
    }

    #plot-canvas {
      z-index: 0;
    }

    #lasso-canvas {
      z-index: 1;
    }

    #axis-svg {
      z-index: 0;
    }


    #scatter-parent {
      position: relative;
    }

    .axis path,
    .axis line {
      fill: none;
      stroke: #000;
      shape-rendering: crispEdges;
    }

    .tick line {
      opacity: 0.2;
    }

    .tooltip {
      box-sizing: border-box;
      position: absolute;
      display: none;
      top: 0;
      left: -100000000px;
      padding: 8px 12px;
      font-family: sans-serif;
      font-size: 12px;
      color: #333;
      background-color: #fff;
      border: 1px solid #333;
      border-radius: 4px;
      pointer-events: none;
      z-index: 2;
      opacity: unset;
    }
  </style>

  <script src="{{url_for('static', filename='libs/d3/js/d3.v5.min.js')}}"></script>
  <script src="{{url_for('static', filename='libs/parcoords/js/parcoords.standalone.js')}}"></script>
  <script src="{{url_for('static', filename='js/slickgrid.js')}}" id="brushing"></script>
</head>

<body>
  <title>TraitHorizon</title>

  <div id="banner" style="display: flex; align-items: center; justify-content: space-between;">
    <h1 style="margin: 0;">TraitHorizon</h1>
    <span id="dropzone-parent" style="display: inline-block; vertical-align: middle; margin-bottom: 0; margin-left: 0;">
      <form action="#" class="dropzone" id="settings-dropzone" style="display: inline-block; background: #e3eafc; border: 2px dashed #426fbd; min-height: 36px; padding: 6px 12px; margin: 6px; vertical-align: middle;">
        <div class="dz-message" data-dz-message style="margin: 0;"><span>Drop filter settings JSON file here or click to upload</span></div>
      </form>
    </span>
  </div>
  <div class="container-fluid">
    <div class="row mb-4">
      <div class="col-12">
        <div class="card" style="height: 45vh;">
          <!-- THE PARALLEL COORDINATES PLOT -->
          <div class="card-body">
            <div id="parcoords-parent" style="overflow-x: scroll;">
              <div id="example" class="parcoords" style="height: 40vh; position: relative;"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="row mb-4">
      <div class="col-12">
        <div class="card" style="height: 30vh;">
          <!-- THE SLICK GRID -->
          <div class="card-body">
            <div id="slickgrid-parent">
              <div style="width:100%;">
                <div class="grid-header" style="width:100%; display: flex; align-items: center; justify-content: space-between; background: #f5f8fc; border-bottom: 1px solid #d1e3f8; padding: 10px 16px; box-sizing: border-box; min-height: 48px;">
                  <div style="display: flex; align-items: center;">
                    <label style="font-weight: 600; font-size: 1.1em; margin-right: 18px;">SlickGrid</label>
                  </div>
                  <span id="filter-toggle"
                    style="margin-left: 18px; cursor:pointer; vertical-align: middle; font-size: 1.3em;"
                    class="sgi sgi-search" title="Toggle search panel"></span>
                </div>
                <div id="grid" class="slick-container alpine-theme" style="width:100%;height:500px; background: #fff; border-radius: 0 0 6px 6px; box-shadow: 0 2px 8px rgba(66,111,189,0.04);"></div>
                <div id="pager" style="width:100%; background: #f5f8fc; border-top: 1px solid #d1e3f8; border-radius: 0 0 6px 6px;"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>



  <div id="inlineFilterPanel" style="display:none;background:#f6f6f6;color:black;height:100%;padding:4px">
    Filter rows by <select id="filter-select" name="languages" id="lang">
    </select> <input type="text" id="txtSearch">
  </div>
</body>

</html>
